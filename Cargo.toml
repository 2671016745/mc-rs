[package]
name = "mc-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9"
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.11"
md5 = "0.8.1"
mlua = { version = "0.9", features = ["lua54", "vendored"] }
rand = "0.8"
rsa = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
thiserror = "2.0.21"
toml = "1.2.1"
ureq = { version = "2.12.1", features = ["json"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }
